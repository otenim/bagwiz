name: pre-commit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-base
    steps:
      - name: Install system tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg python3-pip
          # Node.js 20 is needed for prettier / markdownlint-cli hooks.
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          pip install pre-commit

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install rosdep dependencies
        shell: bash
        run: |
          rosdep update --rosdistro humble
          rosdep install --from-paths . --ignore-src -y --rosdistro humble

      - name: Build (generates compile_commands.json for clang-tidy)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          ./build.sh --build-type release

      - name: Run pre-commit
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          pre-commit run --all-files --show-diff-on-failure

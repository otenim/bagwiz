name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pixi:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-latest
    env:
      # ccache (a pixi dependency) wraps every compile in the colcon and GLIM
      # deps builds via CMAKE_*_COMPILER_LAUNCHER (see scripts/bagwiz-build.sh).
      # Keep the cache inside the workspace so actions/cache can restore it.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pixi provisions ROS 2 (RoboStack) + the C/C++ toolchain (conda-forge)
      # from the committed pixi.lock, so no system ROS install or rosdep is
      # needed. `environments` installs only the distro under test; the lockfile
      # is cached keyed on its hash.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.73.0
          environments: ${{ matrix.distro }}

      # `build-full` is a SLAM build on humble/jazzy: it builds the GLIM stack (GTSAM
      # + gtsam_points + glim) from source into install/<distro>/glim-deps, which
      # takes tens of minutes cold. Cache that vendored prefix keyed on the build
      # script (the pinned GLIM/GTSAM refs live there); on a hit, build-glim-deps.sh
      # finds its stamp and no-ops.
      - name: Cache GLIM SLAM deps
        uses: actions/cache@v4
        with:
          path: install/${{ matrix.distro }}/glim-deps
          key: glim-deps-${{ matrix.distro }}-${{ hashFiles('scripts/build-glim-deps.sh') }}

      # ccache carries the compiled objects for everything outside the GLIM
      # prefix (and for the GLIM stack itself when its cache above misses), so
      # a PR only recompiles the TUs it touches. A run-scoped key saves each
      # run's updated cache; the restore key falls back to the most recent
      # entry for this distro, including entries saved on the base branch.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: ccache-${{ matrix.distro }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.distro }}-

      - name: Build
        run: |
          pixi run -e ${{ matrix.distro }} ccache --zero-stats
          pixi run -e ${{ matrix.distro }} build-full
          pixi run -e ${{ matrix.distro }} ccache --show-stats

      - name: Test
        run: pixi run -e ${{ matrix.distro }} test-full

      # Unit tests cannot see this: rosbag2 picks its metadata decoder from the
      # declared `version`, and jazzy+ parses that metadata while deciding
      # whether a storage plugin can open the file, so a structure/version
      # mismatch makes the bag unopenable rather than merely misreported. Run
      # the real `ros2 bag info` against bags bagwiz just wrote, on both distros
      # in the matrix.
      - name: Check rosbag2 compatibility
        run: pixi run -e ${{ matrix.distro }} bash scripts/check-rosbag2-compat.sh
